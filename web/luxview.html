<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水滴关系网 · 光影(模块③)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(20, 24, 32, 0.62);
        border: 1px solid rgba(200, 210, 230, 0.35);
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.7;
        color: #e8ecf4;
        user-select: none;
        backdrop-filter: blur(6px);
      }
      .hud b {
        font-weight: 600;
      }
      .hud .row {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        min-width: 180px;
      }
      .hud .btns {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .hud button {
        font: inherit;
        font-size: 11px;
        padding: 3px 8px;
        border: 1px solid rgba(200, 210, 230, 0.4);
        background: rgba(60, 68, 84, 0.6);
        color: #e8ecf4;
        cursor: pointer;
      }
      .hud button:hover {
        background: rgba(90, 100, 120, 0.7);
      }
      .hud button.lux-active {
        background: #e8ecf4;
        color: #1a2030;
        border-color: #e8ecf4;
      }
      .tod-row {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(200, 210, 230, 0.25);
      }
      .tod-row .tod-label {
        font-size: 11px;
        opacity: 0.75;
        margin-bottom: 4px;
      }
      #gray-error {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 70vw;
        background: #fff;
        border: 1px solid #b00020;
        color: #b00020;
        padding: 10px 14px;
        font-size: 13px;
        white-space: pre-wrap;
      }
      .legend {
        position: fixed;
        right: 12px;
        bottom: 12px;
        font-size: 11px;
        color: rgba(232, 236, 244, 0.8);
        text-align: right;
        line-height: 1.6;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud">
      <b>水滴关系网 · 光影渲染</b>
      <div class="row"><span>fps</span><span id="gray-fps">—</span></div>
      <div class="row"><span>simTime (s)</span><span id="gray-time">0.00</span></div>
      <div class="row"><span>固定步数</span><span id="gray-steps">0</span></div>
      <div class="row"><span>波场能量</span><span id="gray-energy">—</span></div>
      <div class="row"><span>液滴数</span><span id="gray-droplets">—</span></div>
      <div class="row"><span>聚合次数</span><span id="gray-merges">—</span></div>
      <div class="btns">
        <button id="gray-btn-pause">暂停</button>
        <button id="gray-btn-step">单步</button>
        <button id="gray-btn-reset">重置</button>
        <button id="gray-btn-wire">线框:关</button>
        <button id="gray-btn-drop">落滴</button>
        <button id="gray-btn-pair">落桥对</button>
        <button id="gray-btn-net">网络</button>
      </div>
      <div class="tod-row">
        <div class="tod-label">时段光系(版本一 · 四种光影)</div>
        <div class="btns">
          <button id="lux-btn-dawn" class="lux-active">清晨</button>
          <button id="lux-btn-noon">正午</button>
          <button id="lux-btn-dusk">傍晚</button>
          <button id="lux-btn-night">深夜</button>
        </div>
      </div>
    </div>

    <div id="gray-error"></div>

    <div class="legend">
      水的光学材质:Fresnel 反射 · 折射看水底 · 焦散 · 镜面高光<br />
      清晨薄雾 / 正午强光 / 傍晚金橙辉光 / 深夜月光与金色光点<br />
      悬停或点击液滴:仅该滴的液桥变亮加粗 · 双击液滴:聚焦<br />
      鼠标拖拽旋转 / 滚轮缩放(观察用) · Esc 退出聚焦
    </div>

    <script type="module" src="/src/luxview/main.ts"></script>
  </body>
</html>
